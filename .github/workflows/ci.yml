name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: Build & test
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Show Swift version
        run: swift --version

      # The JSON catalog is the source of truth; the Swift file is generated from it. This catches a
      # preset added to the JSON but never regenerated, and a generated file edited by hand.
      - name: Check the preset catalog is in sync
        run: |
          swift Scripts/generate-presets.swift
          git diff --exit-code -- Sources/LinkRouter/Routing/SitePresets+Generated.swift \
            || { echo "::error::SitePresets+Generated.swift is stale. Run: swift Scripts/generate-presets.swift"; exit 1; }

      - name: Build
        run: swift build

      - name: Test
        run: swift test

      - name: Assemble app bundle
        run: bash Scripts/assemble-app.sh
